[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pendulo-mlp-hnn"
version = "1.0.0"
description = "Comparacion reproducible de campos aprendidos para el pendulo simple"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "torch>=2.1", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
pendulo = "pendulum_project.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
